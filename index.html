<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuelta a Quila Quina</title>
<meta name="description" content="Mapa del circuito a pie de Quila Quina, desde el muelle.">
<meta name="theme-color" content="#F3E9DC">

<style>
*{box-sizing:border-box}html,body{margin:0;background:#F3E9DC}
.ph{width:100%;max-width:480px;min-height:100dvh;margin:0 auto;background:#F3E9DC;overflow:hidden;font-family:'Trebuchet MS',sans-serif;color:#2F4A3A;display:flex;flex-direction:column;box-sizing:border-box}
.hd{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:flex-end}
.hd small{display:block;color:#8A9A6B;font-size:14px}
.hd h3{margin:0;font-size:28px;color:#B5502F;font-weight:500}
.hd span{font-size:13px;color:#F3E9DC;background:#2F4A3A;border-radius:14px;padding:6px 11px;margin-bottom:4px}
.mp{margin:0 10px;border-radius:16px;overflow:hidden;position:relative}
.mp svg{display:block;width:100%;height:245px}
.fit{position:absolute;right:8px;top:8px;border:0;background:#F3E9DCdd;color:#2F4A3A;border-radius:14px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.dots{display:flex;gap:6px;justify-content:center;padding:12px 0 8px}
.dots i{width:7px;height:7px;border-radius:4px;background:#d8cbb6;transition:.3s}
.vw{overflow:hidden;padding:2px 0 4px 16px;clip-path:inset(0 0 0 12px)}
.tk{display:flex;gap:10px;transition:transform .35s ease}
.cd{flex:0 0 calc(100vw - 92px);max-width:388px;box-sizing:border-box;background:#fff;border:2.5px solid;border-radius:18px;padding:14px 16px}
.cd .n{display:inline-flex;flex:0 0 26px;height:26px;border-radius:50%;color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:8px}
.cd h4{margin:0;font-size:18px;display:flex;align-items:center}
.cd .ds{font-size:13px;color:#8a7a62;margin:6px 0}
.cd p{font-size:14px;line-height:1.4;margin:0 0 10px;min-height:40px}
.cd button{border:0;border-radius:20px;padding:8px 16px;color:#fff;font:inherit;font-size:15px;cursor:pointer;float:right}
.ch{display:inline-block;font-size:12px;background:#F3E9DC;border-radius:10px;padding:2px 8px;margin:0 4px 6px 0}
.ac{display:inline-block;font-size:12px;color:#fff;background:#B5502F;border-radius:10px;padding:2px 8px;margin-left:auto}
.sw{display:flex;gap:6px;justify-content:center;margin:0 0 10px;font-family:'Trebuchet MS',sans-serif}
.sw button{border:1px solid #2F4A3A;background:#fff;color:#2F4A3A;border-radius:14px;padding:5px 14px;cursor:pointer}
.sw button.on{background:#2F4A3A;color:#F3E9DC}
@media(min-width:820px){.ph{max-width:1100px;min-height:0;height:100vh;display:grid;grid-template-columns:1fr 372px;grid-template-rows:auto auto auto 1fr}
.hd{grid-column:1/3}.mp{grid-row:2/5;margin:0 0 16px 16px}.mp svg{height:100%!important}
.dots,.vw{grid-column:2}.ad{grid-column:2;margin:12px 16px auto;align-self:start}.vw{clip-path:inset(0 8px 0 12px)}.cd{flex-basis:340px}}
.ad{margin:auto 16px 16px;border-radius:16px;padding:13px 15px;color:#F3E9DC;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .3s}
.ad b{display:block;font-size:15px}.ad small{font-size:12px;opacity:.85}
.ad a{color:#2F4A3A;background:#F3E9DC;border-radius:16px;padding:7px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
</style>

<script>
const C=['#B5502F','#D9953A','#8A9A6B','#2F4A3A','#6FA3A8'];
const S=[
{c:['Artesanos','Baños','Kayak y sombrillas','Lanchas'],t:'Muelle',p:[552,272],d:'Inicio y fin · vuelta completa 1 h 30',x:'Bahía reparada del viento. Puestos de artesanos, alquiler de sombrillas y kayaks, y salidas en lancha.',a:['Salidas en lancha por el Lácar','Pesca y paseos en familia desde 1991','pesca.lacar']},
{c:['Seccional cerca'],t:'Escuela 33',p:[415,127],d:'600 m · 15 min',x:'Escuela de la comunidad. A 230 m por la calle del medio está la seccional de guardaparques.',a:['Dulces caseros','Hechos en Quila Quina','Ver más']},
{c:['Playa'],t:'La Puntilla',p:[360,52],d:'250 m · 7 min',x:'La punta de Quila Quina. Una de las playas más lindas, con vista abierta al lago.',a:['Tu publicidad acá','Espacio para comercios locales','Ver más']},
{c:['Kitesurf'],t:'Desembocadura',p:[168,100],d:'550 m · 15 min',x:'Donde el Arroyo Grande llega al lago. El camino va por adentro, no por la playa. Cerca se practica kitesurf.',a:['Artesanías en madera','Puestos junto al muelle','Ver más']},
{c:['Sombra','Arroyo'],t:'Cipresal',p:[156,180],d:'190 m · 5 min',x:'Bosque de cipreses a lo largo del arroyo. Seguí por la margen derecha hasta el puente.',a:['Tu publicidad acá','Espacio para comercios locales','Ver más']},
{c:['Baño','Entrada paga'],t:'Cascada "Arroyo Grande"',p:[205,290],d:'485 m · 13 min',x:'Entrada al rápido del Arroyo Grande. La comunidad cobra la entrada.',a:['Cabalgatas','Salidas junto a la capilla','Ver más']},
{c:['Solo a pie'],t:'Virgen y agua mineral',p:[490,401],d:'730 m · 20 min',x:'Sendero solo a pie. Pasás por la gruta de la Virgen y la vertiente de agua mineral.',a:['Tu publicidad acá','Espacio para comercios locales','Ver más']},
{c:['Cabalgatas'],t:'Capilla y cabalgatas',p:[577,338],d:'320 m · 9 min',x:'La capilla, siempre cerrada, y al lado las cabalgatas. Desde acá quedan 150 m (4 min) al muelle.',a:['Salidas en lancha por el Lácar','Volvé al muelle y salí al lago','pesca.lacar']}
];
const N=S.length,ns='http://www.w3.org/2000/svg',svg=document.getElementById('m');
const tr=document.getElementById('tr'),L=tr.getTotalLength(),dn=document.getElementById('dn'),pin=document.getElementById('pin');
const PT=[];for(let l=0;l<=L;l+=3)PT.push(tr.getPointAtLength(l));
S.forEach(s=>{let b=0,bd=1e9;PT.forEach((q,k)=>{const dd=(q.x-s.p[0])**2+(q.y-s.p[1])**2;if(dd<bd){bd=dd;b=k*3;}});s.l=b;});S[0].l=0;
const st=document.getElementById('st');
S.forEach((s,i)=>{const g=document.createElementNS(ns,'g');g.style.cursor='pointer';g.innerHTML=`<circle cx="${s.p[0]}" cy="${s.p[1]}" r="14" fill="${C[i%5]}" stroke="#fff" stroke-width="3"/><text x="${s.p[0]}" y="${s.p[1]+5}" text-anchor="middle" fill="#fff" font-size="14">${i+1}</text>`;g.onclick=()=>go(i);st.appendChild(g);});
function setLen(l){const n=Math.floor(l/3);let d='M'+PT[0].x+' '+PT[0].y;for(let k=1;k<=n&&k<PT.length;k++)d+=' L'+PT[k].x.toFixed(1)+' '+PT[k].y.toFixed(1);const e=tr.getPointAtLength(Math.min(l,L));d+=' L'+e.x.toFixed(1)+' '+e.y.toFixed(1);dn.setAttribute('d',l>0?d:'');pin.setAttribute('transform',`translate(${e.x.toFixed(1)},${(e.y-14).toFixed(1)})`);}
const FULL=[40,30,640,400];let vb=FULL.slice(),cur=0,raf;
function boxFor(i){if(i==0||PC)return FULL;const r=svg.getBoundingClientRect(),H=245*(PC?1.5:1),W=H*r.width/r.height,p=S[i].p;return[Math.max(40,Math.min(680-W,p[0]-W/2)),Math.max(30,Math.min(430-H,p[1]-H/2)),W,H];}
function anim(toL,toB,wrap){cancelAnimationFrame(raf);const fL=cur,fB=vb.slice(),t0=performance.now(),D=900;
function step(n){const k=Math.min(1,(n-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cur=fL+(toL-fL)*e;vb=fB.map((v,j)=>v+(toB[j]-v)*e);svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));setLen(cur);
if(k<1)raf=requestAnimationFrame(step);else if(wrap){cur=0;setLen(0);}}raf=requestAnimationFrame(step);}
const tk=document.getElementById('tk'),dt=document.getElementById('dt'),ad=document.getElementById('ad');
let h='';for(let r=0;r<3;r++)S.forEach((s,i)=>{const c=C[i%5];h+=`<div class="cd" style="border-color:${c}"><h4><span class="n" style="background:${c}">${i+1}</span>${s.t}${i==0?'<span class="ac">📍 Estás acá</span>':''}</h4><div class="ds">${s.d}</div><div>${s.c.map(x=>`<span class="ch">${x}</span>`).join('')}</div><p>${s.x}</p><button style="background:${c}" onclick="nx()">${i==N-1?'Volver al muelle ↻':'Seguir ›'}</button></div>`;});
tk.innerHTML=h;S.forEach(()=>dt.appendChild(document.createElement('i')));
let pos=N,idx=0;
function place(a){tk.style.transition=a?'':'none';tk.style.transform=`translateX(${-pos*(tk.firstChild.offsetWidth+10)}px)`;}
function show(i,fwd){const prev=idx;idx=i;const a=document.getElementById('aca');if(a)a.style.display=i==0?'':'none';const s=S[i];
const wrap=fwd&&i==0&&prev==N-1;anim(wrap?L:s.l,boxFor(i),wrap);
[...dt.children].forEach((d,j)=>{d.style.background=j==i?C[i%5]:'#d8cbb6';d.style.width=j==i?'18px':'7px'});
ad.innerHTML=`<div><b>${s.a[0]}</b><small>${s.a[1]}</small></div><a href="#" onclick="return false">${s.a[2]} ›</a>`;
ad.style.background=['#B5502F','#2F4A3A'].includes(C[i%5])?C[i%5]:'#2F4A3A';}
function nx(){pos++;place(1);show(((pos%N)+N)%N,true);}
function pv(){pos--;place(1);show(((pos%N)+N)%N,false);}
function go(i){if(i===idx)return;pos=N+i;place(1);show(i,i>idx);}
tk.addEventListener('transitionend',e=>{if(e.target!==tk)return;if(pos>=2*N){pos-=N;place(0);}else if(pos<N){pos+=N;place(0);}});
let sx=null;tk.addEventListener('pointerdown',e=>sx=e.clientX);tk.addEventListener('pointerup',e=>{if(sx==null)return;const d=e.clientX-sx;if(d<-40)nx();else if(d>40)pv();sx=null;});
document.getElementById('fit').onclick=()=>anim(cur,FULL,false);
const mq=matchMedia('(min-width:820px)');let PC=mq.matches;
function mode(){PC=mq.matches;svg.setAttribute('preserveAspectRatio',PC?'xMidYMid meet':'xMidYMid slice');place(0);anim(cur,boxFor(idx),false);}
mq.addEventListener('change',mode);addEventListener('resize',()=>place(0));
const QR=new URLSearchParams(location.search).get('qr')==='muelle';
if(!QR){document.getElementById('aca').remove();document.querySelectorAll('.ac').forEach(e=>e.remove());}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.nx=nx;mode();setLen(0);show(0,false);
</script>
