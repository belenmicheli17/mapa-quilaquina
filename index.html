const QR=new URLSearchParams(location.search).get('qr')==='muelle';
let lang='es';try{lang=localStorage.getItem('qq-lang')||'';}catch(e){}
if(!UI[lang]){const n=(navigator.language||'es').slice(0,2);lang=UI[n]?n:'es';}
const N=STOPS.length,ns='http://www.w3.org/2000/svg',svg=document.getElementById('m'),$=id=>document.getElementById(id);
const tr=$('tr'),L=tr.getTotalLength(),dn=$('dn'),pin=$('pin');
const PT=[];for(let l=0;l<=L;l+=3)PT.push(tr.getPointAtLength(l));
STOPS.forEach(s=>{let b=0,bd=1e9;PT.forEach((q,k)=>{const dd=(q.x-s.p[0])**2+(q.y-s.p[1])**2;if(dd<bd){bd=dd;b=k*3;}});s.l=b;});STOPS[0].l=0;
const st=$('st');
STOPS.forEach((s,i)=>{const g=document.createElementNS(ns,'g');g.style.cursor='pointer';g.innerHTML=`<circle cx="${s.p[0]}" cy="${s.p[1]}" r="14" fill="${COL[i%5]}" stroke="#fff" stroke-width="3"/><text x="${s.p[0]}" y="${s.p[1]+5}" text-anchor="middle" fill="#fff" font-size="14">${i+1}</text>`;g.onclick=()=>go(i);st.appendChild(g);});
function setLen(l){const n=Math.floor(l/3);let d='M'+PT[0].x+' '+PT[0].y;for(let k=1;k<=n&&k<PT.length;k++)d+=' L'+PT[k].x.toFixed(1)+' '+PT[k].y.toFixed(1);const e=tr.getPointAtLength(Math.min(l,L));d+=' L'+e.x.toFixed(1)+' '+e.y.toFixed(1);dn.setAttribute('d',l>0?d:'');pin.setAttribute('transform',`translate(${e.x.toFixed(1)},${(e.y-14).toFixed(1)})`);}
const FULL=[40,30,640,400];let vb=FULL.slice(),cur=0,raf,PC=false;
function boxFor(i){if(i==0||PC)return FULL;const r=svg.getBoundingClientRect(),H=245,W=H*r.width/r.height,p=STOPS[i].p;return[Math.max(40,Math.min(680-W,p[0]-W/2)),Math.max(30,Math.min(430-H,p[1]-H/2)),W,H];}
function anim(toL,toB,wrap){cancelAnimationFrame(raf);const fL=cur,fB=vb.slice(),t0=performance.now(),D=900;
function step(n){const k=Math.min(1,(n-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cur=fL+(toL-fL)*e;vb=fB.map((v,j)=>v+(toB[j]-v)*e);svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));setLen(cur);
if(k<1)raf=requestAnimationFrame(step);else if(wrap){cur=0;setLen(0);}}raf=requestAnimationFrame(step);}
const tk=$('tk'),tk2=$('tk2'),vw1=$('vw1'),vw2=$('vw2'),dt=$('dt');
STOPS.forEach(()=>dt.appendChild(document.createElement('i')));
const waURL=()=>`https://wa.me/${WA_NUM}?text=${encodeURIComponent(AD[lang].msg)}`;
const btns=()=>`<a class="b wa" href="${waURL()}" target="_blank" rel="noopener">WhatsApp</a><a class="b ig" href="${IG}" target="_blank" rel="noopener">Instagram</a>`;
function cardHTML(i){const s=STOPS[i],t=TX[lang][i],u=UI[lang],c=COL[i%5];
const pills=t.c.map(x=>x.startsWith('H:')?`<span class="ch">${HORSE}${x.slice(2)}</span>`:`<span class="ch">${x}</span>`).join('');
return `<div class="it cd" style="border-color:${c}"><h4><span class="n" style="background:${c}">${i+1}</span>${t.n}${i==0&&QR?`<span class="ac">📍 ${u.here}</span>`:''}</h4><div class="ds">${t.d}</div>${pills?`<div>${pills}</div>`:''}<p>${t.x}</p>${t.v?`<div class="vt"><b>${t.v[0]}</b>${t.v[1]}</div>`:''}<div class="ft">${s.wc?`<span class="wc">${u.wc}</span>`:''}<button class="go" style="background:${c}" onclick="nx()">${i==N-1?u.back:u.next}</button></div></div>`;}
function adHTML(i){const s=STOPS[i],c=COL[i%5],u=UI[lang],a=AD[lang];
if(s.ad=='act')return `<div class="it ad" style="--c:${c}"><b>${u.act}</b><ul>${AC[lang].map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
if(SG[lang][s.ad]){const g=SG[lang][s.ad];return `<div class="it ad sg"><span class="ic">${ICON[s.ad]}</span><div><b>${g[0]}</b><small>${g[1]}</small></div></div>`;}
return `<div class="it ad" style="--c:${c}"><b>${a[s.ad][0]}</b><small>${a[s.ad][1]}</small>${btns()}</div>`;}
let pos=N,idx=0;
function build(){let h='',h2='';for(let r=0;r<3;r++)for(let i=0;i<N;i++){h+=cardHTML(i);h2+=adHTML(i);}tk.innerHTML=h;tk2.innerHTML=h2;}
function applyLang(){const u=UI[lang];document.documentElement.lang=lang;
$('t-w').textContent=u.w;$('t-off').textContent=u.off;$('t-dur').textContent=u.dur;$('fit').textContent=u.fit;$('t-aca').textContent=u.here;$('t-lcar').textContent=u.lcar;$('t-lfoot').textContent=u.lfoot;
$('lb-lake').textContent=u.lake;$('lb-secc').textContent=u.secc;$('lb-cobro').textContent=u.cobro;$('lb-cab').textContent=u.cab;
TX[lang].forEach((t,i)=>{const e=$('lb-'+(i+1));const parts=t.m.split('|');if(parts.length>1){const x=e.getAttribute('x');e.innerHTML=`<tspan x="${x}">${parts[0]}</tspan><tspan x="${x}" dy="17">${parts[1]}</tspan>`;}else e.textContent=t.m;});
document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
build();place(0);fitH();}
const stepW=()=>tk.firstChild.offsetWidth+10;
function setX(x,a){const t=a?'':'none';tk.style.transition=t;tk2.style.transition=t;tk.style.transform=tk2.style.transform=`translateX(${x}px)`;}
function place(a){setX(-pos*stepW(),a);}
function fitH(){const a=tk.children[pos],b=tk2.children[pos];if(a)vw1.style.height=(a.offsetHeight+8)+'px';if(b)vw2.style.height=(b.offsetHeight+8)+'px';}
function show(i,fwd){const prev=idx;idx=i;const a=$('aca');if(a)a.style.display=(i==0&&QR)?'':'none';
const wrap=fwd&&i==0&&prev==N-1;anim(wrap?L:STOPS[i].l,boxFor(i),wrap);
[...dt.children].forEach((d,j)=>{d.style.background=j==i?COL[i%5]:'#d8cbb6';d.style.width=j==i?'18px':'7px'});fitH();}
function nx(){pos++;place(1);show(((pos%N)+N)%N,true);}
function pv(){pos--;place(1);show(((pos%N)+N)%N,false);}
function go(i){if(i===idx)return;pos=N+i;place(1);show(i,i>idx);}
tk.addEventListener('transitionend',e=>{if(e.target!==tk)return;if(pos>=2*N){pos-=N;place(0);fitH();}else if(pos<N){pos+=N;place(0);fitH();}});
[vw1,vw2].forEach(vw=>{let dr=null;
vw.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;dr={x:e.clientX,id:e.pointerId,m:false};});
vw.addEventListener('pointermove',e=>{if(!dr||e.pointerId!==dr.id)return;const dx=e.clientX-dr.x;
if(!dr.m&&Math.abs(dx)>8){dr.m=true;vw.setPointerCapture(e.pointerId);setX(-pos*stepW(),0);}
if(dr.m)setX(-pos*stepW()+dx,0);});
vw.addEventListener('pointerup',e=>{if(!dr)return;const dx=e.clientX-dr.x,m=dr.m;dr=null;if(!m)return;
if(dx<-50)nx();else if(dx>50)pv();else place(1);vw.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();},{capture:true,once:true});});
vw.addEventListener('pointercancel',()=>{if(dr&&dr.m)place(1);dr=null;});});
$('fit').onclick=()=>anim(cur,FULL,false);
function setVB(v){const W=Math.min(900,Math.max(140,v[2])),H=W*v[3]/v[2],cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;
vb=[cx-W/2,cy-H/2,W,H];vb[0]=Math.min(680-W/2,Math.max(40-W/2,vb[0]));vb[1]=Math.min(430-H/2,Math.max(30-H/2,vb[1]));svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));}
function zoomAt(f,px,py){cancelAnimationFrame(raf);const R=svg.getBoundingClientRect(),ux=vb[0]+(px-R.left)/R.width*vb[2],uy=vb[1]+(py-R.top)/R.height*vb[3];setVB([ux-(ux-vb[0])*f,uy-(uy-vb[1])*f,vb[2]*f,vb[3]*f]);setLen(cur);}
const ptrs=new Map();let pd=0,moved=false;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(ptrs.size==2){const[a,b]=[...ptrs.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId),R=svg.getBoundingClientRect();
if(ptrs.size==1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(dx,dy)<6)return;if(!moved){moved=true;svg.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);}
const k=Math.max(vb[2]/R.width,vb[3]/R.height);setVB([vb[0]-dx*k,vb[1]-dy*k,vb[2],vb[3]]);}
ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(ptrs.size==2){moved=true;const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)zoomAt(pd/d,(a.x+b.x)/2,(a.y+b.y)/2);pd=d;}});
const up=e=>{ptrs.delete(e.pointerId);pd=0;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(moved){e.stopPropagation();moved=false;}},true);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});
const ctr=f=>{const R=svg.getBoundingClientRect();zoomAt(f,R.left+R.width/2,R.top+R.height/2);};
$('zi').onclick=()=>ctr(1/1.4);$('zo').onclick=()=>ctr(1.4);
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('qq-lang',lang);}catch(e){}applyLang();});
const mq=matchMedia('(min-width:820px)');
function mode(){PC=mq.matches;svg.setAttribute('preserveAspectRatio',PC?'xMidYMid meet':'xMidYMid slice');place(0);fitH();anim(cur,boxFor(idx),false);}
mq.addEventListener('change',mode);addEventListener('resize',()=>{place(0);fitH();});
window.nx=nx;applyLang();mode();setLen(0);show(0,false);setTimeout(fitH,200);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
